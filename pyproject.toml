[project]
name = "my-car-tracker"
version = "0.1.0"
description = "Private Audi Q8 listing and price-history tracker"
requires-python = ">=3.12"
dependencies = [
  "Django>=6.0.8,<6.1",
  "psycopg[binary]>=3.3,<4",
  "httpx[socks]>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "gunicorn>=25.3,<26",
  "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = ["ruff>=0.16,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
