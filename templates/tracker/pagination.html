{% if page.has_other_pages %}<nav aria-label="Pagination" class="d-flex gap-3 align-items-center">{% if page.has_previous %}<a href="?{{ query_params }}{% if query_params %}&{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}<span class="small">{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ query_params }}{% if query_params %}&{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
